<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questões</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
body{background:#f3f5f7;color:#263238;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
*{box-sizing:border-box}button,input{font:inherit}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#f1f1f1}::-webkit-scrollbar-thumb{background:#90a4ae;border-radius:3px}
.option-eliminated .option-text-content{text-decoration:line-through;opacity:.4}.option-eliminated .option-letter-box{opacity:.35}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;backdrop-filter:blur(2px)}.modal.open{display:flex}
</style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#009688] selection:text-white">
<header class="sticky top-0 z-30 bg-[#f3f5f7]/95 backdrop-blur-sm border-b border-slate-200/80">
  <div class="max-w-[1220px] mx-auto px-4 sm:px-8 h-16 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 sm:gap-5">
      <div class="flex items-center gap-1 text-sm text-slate-600">
        <button id="prev" class="p-1.5 text-[#009688] hover:bg-slate-200/70 rounded transition disabled:opacity-30" title="Questão anterior (←)"><i data-lucide="chevron-left" class="w-5 h-5 stroke-[2.5]"></i></button>
        <span class="text-slate-600 text-[13px]">Pág.</span>
        <span id="current" class="w-12 h-9 flex items-center justify-center bg-white border border-slate-300 rounded-[4px] text-sm font-medium text-slate-800">1</span>
        <span class="text-slate-600 text-[13px]">de <span id="total">0</span></span>
        <button id="next" class="p-1.5 text-[#009688] hover:bg-slate-200/70 rounded transition disabled:opacity-30" title="Próxima questão (→)"><i data-lucide="chevron-right" class="w-5 h-5 stroke-[2.5]"></i></button>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="mapBtn" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-[5px] border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-sm font-medium transition" title="Abrir mapa de questões">
        <i data-lucide="layout-grid" class="w-4 h-4 text-[#009688]"></i><span class="hidden sm:inline">Mapa</span>
      </button>
      <button id="importBtn" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-[5px] border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-sm font-medium transition" title="Importar questões de PDF">
        <i data-lucide="file-up" class="w-4 h-4 text-[#009688]"></i><span class="hidden sm:inline">Importar PDF</span>
      </button>
    </div>
  </div>
</header>
<main class="w-full max-w-[1000px] mx-auto px-4 sm:px-8 py-7 sm:py-10 flex-1"><div id="app"></div></main>

<!-- Mapa lateral de questões -->
<div id="mapOverlay" class="fixed inset-0 bg-slate-900/20 z-40 hidden lg:hidden"></div>
<aside id="questionMap" class="fixed top-0 right-0 h-screen w-[310px] max-w-[88vw] bg-white border-l border-slate-200 shadow-[-8px_0_30px_rgba(15,23,42,.08)] z-50 translate-x-full transition-transform duration-200 flex flex-col">
  <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between gap-3">
    <div>
      <div class="font-bold text-slate-700">Mapa de questões</div>
      <div id="mapSummary" class="text-[11px] text-slate-400 mt-0.5">0 questões</div>
    </div>
    <button id="closeMap" class="p-1.5 rounded hover:bg-slate-100 text-slate-500" title="Fechar mapa"><i data-lucide="x" class="w-5 h-5"></i></button>
  </div>
  <div class="px-5 py-4 border-b border-slate-100">
    <div class="relative">
      <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
      <input id="jumpInput" type="number" min="1" placeholder="Ir para questão..." class="w-full h-10 pl-9 pr-3 rounded-[5px] border border-slate-300 text-sm text-slate-700 outline-none focus:border-[#009688] focus:ring-1 focus:ring-[#009688]/20">
    </div>
  </div>
  <div class="px-5 py-3 border-b border-slate-100 flex flex-wrap gap-x-4 gap-y-2 text-[11px] text-slate-500">
    <span class="inline-flex items-center gap-1.5"><i class="w-2.5 h-2.5 rounded-full bg-slate-200 border border-slate-300"></i>Não feita</span>
    <span class="inline-flex items-center gap-1.5"><i class="w-2.5 h-2.5 rounded-full bg-emerald-500"></i>Acertou</span>
    <span class="inline-flex items-center gap-1.5"><i class="w-2.5 h-2.5 rounded-full bg-rose-500"></i>Errou</span>
  </div>
  <div id="questionGrid" class="flex-1 overflow-y-auto p-5 content-start grid grid-cols-5 gap-2"></div>
  <div class="px-5 py-4 border-t border-slate-100 text-[11px] text-slate-400">Clique em qualquer número para ir direto à questão.</div>
</aside>

<!-- botão flutuante quando o mapa estiver fechado -->
<button id="mapFloating" class="fixed right-4 bottom-5 z-40 hidden items-center gap-2 px-3.5 py-2.5 rounded-full bg-[#009688] hover:bg-[#00796b] text-white text-xs font-semibold shadow-lg transition" title="Abrir mapa">
  <i data-lucide="layout-grid" class="w-4 h-4"></i><span>Mapa</span>
</button>

<div class="modal" id="importModal">
  <div class="bg-white rounded-[8px] shadow-xl w-full max-w-[680px] overflow-hidden">
    <div class="px-5 sm:px-6 py-4 border-b border-slate-200 flex items-center justify-between">
      <h2 class="font-bold text-slate-700">Importar questões</h2>
      <button id="closeImport" class="p-1.5 rounded hover:bg-slate-100 text-slate-500" title="Fechar"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="p-5 sm:p-6">
      <label class="block border-2 border-dashed border-slate-300 hover:border-[#009688] rounded-[8px] p-8 text-center cursor-pointer transition">
        <i data-lucide="file-up" class="w-8 h-8 mx-auto mb-3 text-[#009688]"></i>
        <div class="font-semibold text-slate-700">Selecione o PDF</div>
        <div class="text-xs text-slate-500 mt-1">O arquivo será processado para montar as questões.</div>
        <input type="file" id="pdfInput" accept="application/pdf" class="hidden">
      </label>
      <div id="progress" class="mt-3 text-xs text-slate-500"></div>
    </div>
  </div>
</div>
<script>
const mapEl=document.getElementById('questionMap');
const mapOverlay=document.getElementById('mapOverlay');
const mapFloating=document.getElementById('mapFloating');
function openMap(){ mapEl.classList.remove('translate-x-full'); mapOverlay.classList.remove('hidden'); mapFloating.classList.add('hidden'); renderMap(); }
function closeMap(){ mapEl.classList.add('translate-x-full'); mapOverlay.classList.add('hidden'); mapFloating.classList.remove('hidden'); }
function isQuestionCorrect(q){ return !!(q && q.answered && q.correta && q.selected===q.correta); }
function isQuestionWrong(q){ return !!(q && q.answered && q.correta && q.selected!==q.correta); }
function renderMap(){
  const grid=document.getElementById('questionGrid'); if(!grid)return;
  const total=state.questions.length;
  const done=state.questions.filter(q=>q.answered).length;
  const right=state.questions.filter(isQuestionCorrect).length;
  const wrong=state.questions.filter(isQuestionWrong).length;
  document.getElementById('mapSummary').textContent=`${total} questões · ${done} feitas · ${right} certas · ${wrong} erradas`;
  grid.innerHTML=state.questions.map((q,i)=>{
    const current=i===state.current, correct=isQuestionCorrect(q), wrong=isQuestionWrong(q);
    const cls=correct?'bg-emerald-500 border-emerald-500 text-white hover:bg-emerald-600':wrong?'bg-rose-500 border-rose-500 text-white hover:bg-rose-600':current?'bg-[#009688] border-[#009688] text-white':'bg-white border-slate-300 text-slate-600 hover:border-[#009688] hover:text-[#00796b]';
    return `<button type="button" onclick="jumpToQuestion(${i})" title="Questão ${esc(String(q.numero||i+1))}${correct?' — acertou':wrong?' — errou':''}" class="h-10 rounded-[5px] border text-xs font-semibold transition ${cls} ${current?'ring-2 ring-[#009688]/20':''}">${esc(String(q.numero||i+1))}</button>`;
  }).join('');
  if(window.lucide)lucide.createIcons();
}
function jumpToQuestion(index){
  if(!state.questions.length)return;
  state.current=Math.max(0,Math.min(state.questions.length-1,index)); save(); render(); renderMap();
}
function jumpFromInput(){
  const value=parseInt(document.getElementById('jumpInput').value,10);
  if(Number.isInteger(value) && value>=1 && value<=state.questions.length){ jumpToQuestion(value-1); document.getElementById('jumpInput').value=''; }
}

document.getElementById('mapBtn').onclick=openMap;
document.getElementById('closeMap').onclick=closeMap;
document.getElementById('mapFloating').onclick=openMap;
mapOverlay.onclick=closeMap;
document.getElementById('jumpInput').addEventListener('keydown',e=>{if(e.key==='Enter')jumpFromInput()});

document.addEventListener('keydown',e=>{if(e.key==='Escape' && !mapEl.classList.contains('translate-x-full'))closeMap()});

pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const INITIAL_QUESTIONS=[{"id": 1, "numero": 1, "codigo": "4000165627", "instituicao": "SP - UNIVERSIDADE DE SÃO PAULO - USP (HOSPITAL DAS CLÍNICAS DA FACULDADE DE MEDICINA DA USP)", "ano": "2022", "enunciado": "Mulher, 45 anos de idade, é submetida a histerectomia total abdominal. Após a retirada do útero, o cirurgião sutura a cúpula vaginal através da aproximação da mucosa vaginal com pontos separados de poligalactina 00. Qual é o próximo tempo cirúrgico?", "alternativas": [{"letra": "A", "texto": "Sutura dos ligamentos útero-sacros à cúpula vaginal."}, {"letra": "B", "texto": "Fixação dos ligamentos pubo-vésico-cervicais à cúpula vaginal."}, {"letra": "C", "texto": "Fixação dos ligamentos redondos à cúpula vaginal."}, {"letra": "D", "texto": "Sutura do infundíbulo pélvico à cúpula vaginal."}], "correta": "A", "videoUrl": "https://www.youtube.com/watch?v=M7lc1UVf-VE", "selected": null, "answered": false, "eliminated": []}, {"id": 2, "numero": 2, "codigo": "4000158920", "instituicao": "SP - UNIVERSIDADE DE SÃO PAULO - USP (HOSPITAL DAS CLÍNICAS DA FACULDADE DE MEDICINA DA USP)", "ano": "2022", "enunciado": "Homem de 62 anos, hipertenso e tabagista, dá entrada no pronto-socorro com dor torácica retroesternal em aperto há 90 minutos, irradiada para membro superior esquerdo e associada a sudorese fria. PA: 84x52 mmHg, FC: 52 bpm, turgência jugular patológica a 45° e ausculta pulmonar limpa. O ECG revela supradesnivelamento do segmento ST em DII, DIII e aVF. Além da terapia de reperfusão, a conduta imediata correta é:", "alternativas": [{"letra": "A", "texto": "Administrar nitrato sublingual e morfina endovenosa para controle álgico imediato."}, {"letra": "B", "texto": "Solicitar derivações direitas (V3R e V4R) e iniciar expansão volêmica cuidadosa com cristaloide."}, {"letra": "C", "texto": "Iniciar furosemida endovenosa devido ao ingurgitamento jugular acentuado."}, {"letra": "D", "texto": "Iniciar metoprolol endovenoso para reduzir o consumo miocárdico de oxigênio."}], "correta": "B", "videoUrl": "https://www.youtube.com/watch?v=M7lc1UVf-VE", "selected": null, "answered": false, "eliminated": []}, {"id": 3, "numero": 3, "codigo": "4000140709", "instituicao": "SP - UNIVERSIDADE DE SÃO PAULO - USP (HOSPITAL DAS CLÍNICAS DA FACULDADE DE MEDICINA DA USP)", "ano": "2021", "enunciado": "Menina, 9 anos de idade, vem à consulta de rotina. O pai está preocupado pois recentemente notou uma nodulação na mama direita da filha. Relata que avó paterna faleceu de câncer de mama aos 49 anos. Ao exame clínico nota-se uma elevação da aréola e papila a direita, formando uma pequena saliência, com palpação fibroelástica. Sem alterações do lado esquerdo.\n\nSem outras alterações ao exame clínico. A conduta é:", "alternativas": [{"letra": "A", "texto": "Solicitar ultrassonografia de mama."}, {"letra": "B", "texto": "Solicitar prolactina, TSH e cortisol."}, {"letra": "C", "texto": "Manter conduta expectante."}, {"letra": "D", "texto": "Realizar punção aspirativa por agulha fina."}], "correta": "C", "videoUrl": "https://www.youtube.com/watch?v=M7lc1UVf-VE", "selected": null, "answered": false, "eliminated": []}];
let state={questions:INITIAL_QUESTIONS,current:0};
const STORAGE='questoes_minimal_v1';

function cleanQuestion(q,i){
  return {
    id:q.id||i+1, numero:q.numero||i+1, codigo:q.codigo||'', instituicao:q.instituicao||'',
    ano:q.ano||'', enunciado:q.enunciado||'', alternativas:(q.alternativas||[]).map(a=>({letra:a.letra,texto:a.texto})),
    correta:q.correta||'', videoUrl:q.videoUrl||'', selected:null, answered:false, eliminated:[]
  };
}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function load(){
  try{const x=JSON.parse(localStorage.getItem(STORAGE));if(x?.questions?.length){state.questions=x.questions.map(cleanQuestion);state.current=Math.min(x.current||0,state.questions.length-1)}}catch{}
}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function render(){
  const q=state.questions[state.current];
  document.getElementById('total').textContent=state.questions.length;
  document.getElementById('current').textContent=state.questions.length?state.current+1:0;
  document.getElementById('prev').disabled=state.current<=0;
  document.getElementById('next').disabled=state.current>=state.questions.length-1;
  if(!q){document.getElementById('app').innerHTML='<div class="bg-white rounded-[6px] border border-[#e5e7eb] p-10 text-center text-slate-500">Nenhuma questão.</div>';if(window.lucide)lucide.createIcons();return}
  const hasKey=Boolean(q.correta);
  const isCorrect=q.answered&&hasKey&&q.selected===q.correta;
  const isWrong=q.answered&&hasKey&&q.selected!==q.correta;
  const status=q.answered?(isCorrect?'<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-[#10b981] text-white text-[11px] font-bold uppercase tracking-wide"><i data-lucide="check" class="w-3 h-3"></i>CERTA</span>':isWrong?'<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-rose-500 text-white text-[11px] font-bold uppercase tracking-wide"><i data-lucide="x" class="w-3 h-3"></i>ERRADA</span>':''):'';
  const opts=(q.alternativas||[]).map(a=>{
    const selected=q.selected===a.letra, eliminated=(q.eliminated||[]).includes(a.letra), right=hasKey&&q.correta===a.letra;
    let box='';
    if(!q.answered){box=selected?`<div class="option-letter-box w-[42px] h-[42px] rounded-[5px] bg-[#009688] border-[1.5px] border-[#009688] text-white font-bold text-[15px] flex items-center justify-center shrink-0 transition">${a.letra}</div>`:`<div class="option-letter-box w-[42px] h-[42px] rounded-[5px] bg-white border-[1.5px] border-[#8e99a4] group-hover:border-[#009688] text-[#1f2937] font-bold text-[15px] flex items-center justify-center shrink-0 transition">${a.letra}</div>`}
    else if(right) box=`<div class="option-letter-box w-[44px] h-[44px] rounded-[6px] border-2 border-[#10b981] p-[2px] flex items-center justify-center shrink-0"><div class="w-full h-full rounded-[3px] bg-[#10b981] text-white font-bold text-[15px] flex items-center justify-center">${a.letra}</div></div>`;
    else if(selected&&hasKey) box=`<div class="option-letter-box w-[44px] h-[44px] rounded-[6px] border-2 border-rose-500 p-[2px] flex items-center justify-center shrink-0"><div class="w-full h-full rounded-[3px] bg-rose-500 text-white font-bold text-[15px] flex items-center justify-center">${a.letra}</div></div>`;
    else box=`<div class="option-letter-box w-[42px] h-[42px] rounded-[5px] bg-white border-[1.5px] border-[#8e99a4] text-[#1f2937] font-bold text-[15px] flex items-center justify-center shrink-0">${a.letra}</div>`;
    return `<div onclick="selectOption('${a.letra}')" oncontextmenu="event.preventDefault();eliminate('${a.letra}')" class="group flex items-center gap-4 py-1.5 cursor-pointer select-none ${eliminated&&!q.answered?'option-eliminated':''}">${box}<div class="flex-1 min-w-0"><div class="option-text-content text-[15px] sm:text-[16px] text-[#263238]">${esc(a.texto)}</div></div><button type="button" onclick="event.stopPropagation();eliminate('${a.letra}')" class="opacity-0 group-hover:opacity-100 p-1.5 rounded text-slate-400 hover:text-rose-600 transition shrink-0" title="Riscar alternativa (ou clique com o botão direito)"><i data-lucide="scissors" class="w-4 h-4"></i></button></div>`;
  }).join('');
  const video=q.videoUrl?`<a class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-[5px] bg-[#e0f2f1] hover:bg-[#b2dfdb] text-[#00796b] text-xs font-semibold transition" href="${esc(q.videoUrl)}" target="_blank" rel="noopener" title="Esta questão possui resolução em vídeo"><i data-lucide="play-circle" class="w-4 h-4"></i>Vídeo</a>`:'';
  document.getElementById('app').innerHTML=`<article class="bg-white rounded-[6px] border border-[#e5e7eb] shadow-[0_1px_3px_rgba(0,0,0,0.03)] overflow-hidden">
    <div class="px-6 sm:px-10 py-5 border-b border-[#eef0f3] flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-3 min-w-0"><h2 class="text-[18px] font-bold text-[#00897b] whitespace-nowrap">Questão ${q.numero}</h2>${q.instituicao?`<span class="px-3.5 py-1 rounded-full bg-[#eceff1] text-[#78909c] text-[11.5px] font-medium uppercase tracking-wide truncate max-w-[260px] sm:max-w-[460px]" title="${esc(q.instituicao)}">${esc(q.instituicao)}</span>`:''}${q.ano?`<span class="px-3 py-1 rounded-full bg-[#eceff1] text-[#78909c] text-[11.5px] font-medium">${esc(String(q.ano))}</span>`:''}</div>
      <div class="flex items-center gap-3 text-[#00897b]">${video}</div>
    </div>
    <div class="px-6 sm:px-10 py-7 space-y-6">
      <div class="space-y-2"><div class="flex flex-wrap items-center gap-2">${q.codigo?`<span class="text-[12px] text-[#9e9e9e] tracking-wide">${esc(q.codigo)}</span>`:''}${status}</div><div class="text-[16px] sm:text-[17px] leading-7 text-[#263238] whitespace-pre-line pt-1">${esc(q.enunciado)}</div></div>
      <div class="space-y-3.5 pt-2">${opts}</div>
    </div>
    <div class="px-6 sm:px-10 py-5 border-t border-[#eef0f3] flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3 w-full sm:w-auto"><button onclick="answer()" ${q.answered||!q.selected?'disabled':''} class="w-full sm:w-[260px] py-2.5 px-6 rounded-[5px] font-semibold text-[14px] transition ${q.answered?'bg-[#d4ece9] text-white cursor-default':q.selected?'bg-[#009688] hover:bg-[#00796b] text-white shadow-xs':'bg-[#009688] opacity-85 text-white cursor-not-allowed'}">${q.answered?'Respondida':'Responder'}</button>${q.answered?`<button onclick="retry()" class="inline-flex items-center gap-1.5 px-3 py-2.5 rounded-[5px] border border-slate-200 hover:border-slate-300 text-slate-500 hover:text-slate-700 text-xs font-medium transition" title="Limpar resposta e tentar novamente"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>Refazer</button>`:''}</div>
      <button onclick="skipQuestion()" ${state.current>=state.questions.length-1?'disabled':''} class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-[5px] border border-[#009688] text-[#00897b] hover:bg-[#e0f2f1] disabled:opacity-35 disabled:cursor-not-allowed font-semibold text-[14px] transition sm:ml-auto" title="Pular para a próxima questão">Pular questão <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
    </div>
  </article>`;
  if(window.lucide)lucide.createIcons();
  if(!mapEl.classList.contains('translate-x-full')) renderMap();
}
function selectOption(letter){
  const q=state.questions[state.current]; if(!q||q.answered)return;
  q.eliminated=(q.eliminated||[]).filter(x=>x!==letter);
  q.selected=q.selected===letter?null:letter; save(); render();
}
function eliminate(letter){
  const q=state.questions[state.current]; if(!q||q.answered)return;
  q.eliminated=q.eliminated||[];
  if(q.eliminated.includes(letter)) q.eliminated=q.eliminated.filter(x=>x!==letter);
  else {q.eliminated.push(letter);if(q.selected===letter)q.selected=null}
  save();render();
}
function answer(){const q=state.questions[state.current];if(!q?.selected||q.answered)return;q.answered=true;save();render()}
function retry(){const q=state.questions[state.current];q.selected=null;q.answered=false;q.eliminated=[];save();render()}
function move(n){state.current=Math.max(0,Math.min(state.questions.length-1,state.current+n));save();render();window.scrollTo(0,0)}

document.getElementById('prev').onclick=()=>move(-1);
document.getElementById('next').onclick=()=>move(1);
function skipQuestion(){ if(state.current>=state.questions.length-1)return; state.current++; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
document.getElementById('importBtn').onclick=()=>document.getElementById('importModal').classList.add('open');
document.getElementById('closeImport').onclick=()=>document.getElementById('importModal').classList.remove('open');
document.getElementById('pdfInput').onchange=e=>{if(e.target.files[0])processPdf(e.target.files[0])};
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  if(e.key==='ArrowLeft')move(-1); if(e.key==='ArrowRight')move(1);
  if(['a','b','c','d','e'].includes(e.key.toLowerCase()))selectOption(e.key.toUpperCase());
  if(e.key==='Enter')answer();
});
const VIDEO_HOST_RE = /youtube\.com|youtu\.be|vimeo\.com|loom\.com|vdocipher|pandavideo|wistia|jwplayer|\.mp4|\/video/i;

    function stripLinkTags(s) {
      return String(s || '').replace(/[ \t]*\[(?:LINK_VIDEO|LINK):\s*[^\]]+\][ \t]*/g, ' ');
    }

    // Junta linhas quebradas pelo PDF, preservando parágrafos e marcadores
    function unwrap(s) {
      const lines = String(s || '').replace(/[ \t]+/g, ' ').split('\n').map(l => l.trim());
      let out = '';
      lines.forEach((line) => {
        if (!line) {
          if (out && !out.endsWith('\n\n')) out += '\n\n';
          return;
        }
        if (!out || out.endsWith('\n')) { out += line; return; }
        const prevLine = out.slice(out.lastIndexOf('\n') + 1);
        const isBullet = /^(?:[•●▪◦\-–—*]|\d+[\.\)]|[a-eA-E]\))\s*/.test(line);
        const prevEnds = /[.:!?]$/.test(prevLine) && prevLine.length < 50;
        out += (isBullet || prevEnds) ? '\n' + line : ' ' + line;
      });
      return out.trim();
    }

    // Procura a sequência A, B, C, D (E) de alternativas dentro de um bloco
    function findAltChain(block) {
      const cands = [];
      const seen = new Set();
      const add = (re) => {
        let m;
        while ((m = re.exec(block)) !== null) {
          if (!seen.has(m.index)) {
            seen.add(m.index);
            cands.push({ letra: m[1].toUpperCase(), start: m.index, textStart: m.index + m[0].length });
          }
          if (m[0].length === 0) re.lastIndex++;
        }
      };
      add(/(?:^|\n)[ \t]*\(?([A-Ea-e])[ \t]*[\)\.\-–:][ \t]*(?=\S)/g);
      add(/(?:^|\n)[ \t]*([A-E])(?:[ \t]+|[ \t]*\n)(?=\S)/g);
      cands.sort((a, b) => a.start - b.start);

      let best = null;
      cands.forEach((c, i) => {
        if (c.letra !== 'A') return;
        const chain = [c];
        let next = 'B';
        for (let j = i + 1; j < cands.length; j++) {
          if (cands[j].letra === next) {
            chain.push(cands[j]);
            next = String.fromCharCode(next.charCodeAt(0) + 1);
            if (next > 'E') break;
          }
        }
        if (!best || chain.length >= best.length) best = chain;
      });
      return best && best.length >= 2 ? best : null;
    }

    // Onde começa o gabarito/comentário dentro do bloco da questão (depois das alternativas)
    function findCommentCut(clean) {
      const re = /(?:^|\n)[ \t]*(?:GABARITO|COMENT[ÁA]RIO|RESOLU[ÇC][ÃA]O|SOLU[ÇC][ÃA]O|RESPOSTAS?\s+(?:CORRETA|COMENTADAS?)|QUEST[ÕO]ES\s+COMENTADAS|ALTERNATIVA\s+CORRETA|Caro\s+aluno|Cara\s+aluna|Prezado\s+aluno)/gi;
      let m;
      while ((m = re.exec(clean)) !== null) {
        if (findAltChain(clean.slice(0, m.index))) return m.index;
      }
      return -1;
    }

    function parseQuestionBlock(body) {
      const clean = stripLinkTags(body);
      const cut = findCommentCut(clean);
      const main = cut >= 0 ? clean.slice(0, cut) : clean;
      const commentRaw = cut >= 0 ? clean.slice(cut) : '';

      const chain = findAltChain(main);
      if (!chain) return null;

      let head = main.slice(0, chain[0].start).trim();
      let codigo = '', instituicao = '', ano = '';
      const cm = head.match(/^(?:ID[ \t]*[:\-]?[ \t]*)?(\d{8,12})\b[ \t]*(?:\n|$)/i);
      if (cm) { codigo = cm[1]; head = head.slice(cm[0].length).trim(); }

      // Alguns extratores deixam "ID 1234567890" na mesma linha do cabeçalho.
      if (!codigo) {
        const inlineId = head.match(/\bID[ \t]*[:\-]?[ \t]*(\d{8,12})\b/i);
        if (inlineId) {
          codigo = inlineId[1];
          head = (head.slice(0, inlineId.index) + head.slice(inlineId.index + inlineId[0].length)).trim();
        }
      }

      const im = head.match(/^\(([^()\n]*?)[\s,\-–\/]*((?:19|20)\d{2})\)[ \t]*\n?/);
      if (im) { instituicao = im[1].trim(); ano = im[2]; head = head.slice(im[0].length).trim(); }

      // Cabeçalho alternativo: "(Instituição, 2024)" pode aparecer depois de
      // uma linha de ID ou junto do início do enunciado.
      if (!ano) {
        const im2 = head.match(/^\(([^()\n]{2,100}?)[,\-–\/]+((?:19|20)\d{2})\)[ \t]*\n?/);
        if (im2) {
          instituicao = im2[1].trim();
          ano = im2[2];
          head = head.slice(im2[0].length).trim();
        }
      }

      const alternativas = chain.map((a, i) => {
        const end = chain[i + 1] ? chain[i + 1].start : main.length;
        return {
          letra: a.letra,
          texto: unwrap(main.slice(a.textStart, end)).replace(/\n+/g, ' ').trim(),
          explicacao: ''
        };
      });

      return { codigo, instituicao, ano, enunciado: unwrap(head), alternativas, commentRaw };
    }

    function findCorrectLetter(text) {
      const patterns = [
        /(?:Gabarito|Resposta(?:\s+correta)?|Alternativa\s+correta)(?:\s+oficial)?\s*[:\-–]?\s*(?:Alternativa\s+|Letra\s+)?\(?([A-Ea-e])\)?(?![A-Za-zÀ-ú0-9])/gi,
        /Correta\s+a\s+alternativa\s+\(?([A-E])\)?(?![A-Za-zÀ-ú])/g,
        /Alternativa\s+\(?([A-E])\)?\s+(?:[ée]|est[áa])\s+(?:a\s+)?(?:única\s+)?correta/g
      ];
      for (const p of patterns) {
        let m;
        while ((m = p.exec(text)) !== null) {
          if (m[1] === m[1].toUpperCase()) return m[1];
        }
      }
      return null;
    }

    // Linhas do tipo "1-A  2-B  3-C" (lista de gabarito do PDF)
    const GAB_LIST_LINE_RE = /^(?:[ \t]*0*\d{1,3}[ \t]*[\.\-–:\)]?[ \t]*[A-E]\b[ \t,;]*)+$/;
    function dropGabaritoLists(s) {
      return String(s || '').split('\n').filter(l => !GAB_LIST_LINE_RE.test(l.trim())).join('\n');
    }

    function parseGabaritoLines(text) {
      const map = {};
      text.split('\n').forEach(line => {
        const t = line.trim();
        if (!t || !GAB_LIST_LINE_RE.test(t)) return;
        const pairRe = /0*(\d{1,3})[ \t]*[\.\-–:\)]?[ \t]*([A-E])\b/g;
        let m;
        while ((m = pairRe.exec(t)) !== null) {
          const n = parseInt(m[1], 10);
          if (!map[n]) map[n] = m[2];
        }
      });
      return map;
    }

    // Separa gabarito, comentário geral e explicação de cada alternativa
    function parseComment(raw, letters) {
      let text = stripLinkTags(raw).replace(/[ \t]+\n/g, '\n').trim();
      const correta = findCorrectLetter(text);

      for (let i = 0; i < 8; i++) {
        const before = text;
        text = text.replace(/^\s*\(?\s*Gabarito\s+[A-E]\s*\)?\s*[:\-–]?\s*/i, '');
        text = text.replace(/^\s*(?:GABARITO|RESPOSTA(?:\s+CORRETA)?)[ \t]*[:\-–]?[ \t]*(?:ALTERNATIVA\s+|LETRA\s+)?\(?[A-E]\)?[ \t\.]*(?:\n|$)/i, '');
        text = text.replace(/^\s*(?:Gabaritos?(?=[ \t]*(?:\n|$))|Gabarito\s+(?:Comentado|Oficial)|Coment[áa]rios?(?:\s+do\s+professor)?|Resolu[çc][ãa]o(?:\s+Comentada)?|Solu[çc][ãa]o(?:\s+Comentada)?|Quest[õo]es\s+Comentadas|Respostas\s+Comentadas)\s*[:\-–]?\s*/i, '');
        if (text === before) break;
      }
      text = text.replace(/^[ \t]*(?:GABARITO|RESPOSTA(?:\s+CORRETA)?|ALTERNATIVA\s+CORRETA)(?:\s+OFICIAL)?[ \t]*[:\-–]?[ \t]*(?:ALTERNATIVA\s+|LETRA\s+)?\(?[A-E]\)?[ \t\.]*$/gim, '').trim();

      const re = /(?:^|\n|(?<=[.;:!?]\s))[ \t]*(?:(?:Correta|Incorreta|Certa|Errada)[ \t]+(?:a[ \t]+)?)?(?:alternativa|letra|item|op[çc][ãa]o)[ \t]*\(?([A-Ea-e])\)?(?![A-Za-zÀ-ú])[ \t]*[:\-–\.]?[ \t]*|(?:^|\n)[ \t]*\(?([A-Ea-e])\)[ \t]*[:\-–\.]?[ \t]*/gi;
      const marks = [];
      let m;
      while ((m = re.exec(text)) !== null) {
        const letra = (m[1] || m[2]).toUpperCase();
        if (letters.includes(letra)) marks.push({ letra, start: m.index, textStart: m.index + m[0].length });
        if (m[0].length === 0) re.lastIndex++;
      }

      const expl = {};
      marks.forEach((mk, i) => {
        const seg = unwrap(text.slice(mk.textStart, marks[i + 1] ? marks[i + 1].start : text.length));
        if (seg) expl[mk.letra] = expl[mk.letra] ? expl[mk.letra] + '\n' + seg : seg;
      });

      const general = marks.length ? text.slice(0, marks[0].start) : text;
      return { correta, comentario: unwrap(general), expl };
    }

    function extractLinkInfo(text) {
      const video = [], other = [];
      const push = (arr, u) => {
        u = String(u || '').trim().replace(/[.,;]+$/, '');
        if (u && !video.includes(u) && !other.includes(u)) arr.push(u);
      };
      const tagRe = /\[(LINK_VIDEO|LINK):\s*([^\]]+)\]/gi;
      let m;
      while ((m = tagRe.exec(text)) !== null) push(m[1].toUpperCase() === 'LINK_VIDEO' ? video : other, m[2]);
      const noTags = text.replace(/\[(?:LINK_VIDEO|LINK):\s*[^\]]+\]/gi, ' ');
      const urlRe = /https?:\/\/[^\s\]\)">]+/gi;
      while ((m = urlRe.exec(noTags)) !== null) push(VIDEO_HOST_RE.test(m[0]) ? video : other, m[0]);
      return { videoUrl: video[0] || '', allLinks: [...video, ...other] };
    }

    // Divide o texto em "seções" de questões numeradas.
    // Aceita:
    //   - "Questão 096 - ID ..."
    //   - "Questão 096"
    //   - "096 - ..."
    //   - textos em que o cabeçalho/ID foi removido pelo extrator
    function splitIntoSections(text) {
      const collect = (re) => {
        const out = [];
        let m;
        while ((m = re.exec(text)) !== null) {
          out.push({ num: parseInt(m[1], 10), start: m.index, bodyStart: m.index + m[0].length });
        }
        return out;
      };

      // Primeiro, cabeçalhos explícitos.
      let cands = collect(/(?:^|\n)[ \t]*(?:QUEST[ÃA]O)[ \t]*(?:N[º°o.]*[ \t]*)?0*(\d{1,3})\b[ \t]*(?:[-–:.)][^\n]*)?/gi);
      const explicit = cands.length >= 2;

      // Depois, numeração simples.
      if (!explicit) {
        const simple = collect(/(?:^|\n)[ \t]*0*(\d{1,3})[ \t]*[\.\-–\)][ \t]+(?=\S)/g);
        if (simple.length >= 2) cands = simple;
      }

      // Títulos de seção ("GABARITO COMENTADO", etc.)
      const breaks = [];
      const hRe = /(?:^|\n)[ \t]*(?:GABARITO\s+COMENTADO|RESOLU[ÇC][ÕO]ES(?:\s+COMENTADAS)?|COMENT[ÁA]RIOS(?:\s+DAS\s+QUEST[ÕO]ES)?|QUEST[ÕO]ES\s+COMENTADAS|RESPOSTAS\s+COMENTADAS)[ \t]*:?[ \t]*(?=\n|$)/gi;
      let hm;
      while ((hm = hRe.exec(text)) !== null) breaks.push(hm.index);

      const sections = [];
      let cur = null;
      const nextStartOf = (i) => (i + 1 < cands.length ? cands[i + 1].start : text.length);

      cands.forEach((c, i) => {
        const last = cur ? cur.items[cur.items.length - 1] : null;
        if (!cur) {
          if (explicit || c.num === 1 || findAltChain(text.slice(c.bodyStart, nextStartOf(i)))) {
            cur = { items: [c] };
            sections.push(cur);
          }
          return;
        }

        if (c.num === cur.items[0].num) {
          if (cur.items.length > 1) {
            if (explicit || breaks.some(b => b > last.start && b < c.start)) {
              cur = { items: [c] };
              sections.push(cur);
              return;
            }
          } else {
            cur.items = [c];
            return;
          }
        }

        if (c.num === last.num) {
          if (!findAltChain(text.slice(last.bodyStart, c.start)) &&
              findAltChain(text.slice(c.bodyStart, nextStartOf(i)))) {
            cur.items[cur.items.length - 1] = c;
          }
          return;
        }

        const ok = explicit ? (c.num > last.num && c.num - last.num <= 10) : (c.num === last.num + 1);
        if (ok) cur.items.push(c);
      });

      sections.forEach((s, si) => {
        s.items.forEach((it, k) => {
          const nxt = s.items[k + 1] || (sections[si + 1] && sections[si + 1].items[0]);
          it.end = nxt ? nxt.start : text.length;
          it.body = text.slice(it.bodyStart, it.end);
        });
      });

      return sections;
    }

    // Fallback para texto sem qualquer cabeçalho/numeração:
    // usa a sequência de alternativas A → B → C → D (→ E) como "âncora"
    // para descobrir onde começa cada questão.
    function splitWithoutQuestionHeaders(text) {
      const aRe = /(?:^|\n)[ \t]*\(?A[ \t]*[\)\.\-–:][ \t]*/gi;
      const starts = [];
      let m;

      while ((m = aRe.exec(text)) !== null) {
        const aStart = m.index + (text[m.index] === '\n' ? 1 : 0);
        const probe = text.slice(m.index, Math.min(text.length, m.index + 16000));

        // A alternativa precisa ser seguida por B, C e D em ordem.
        const chain = findAltChain(probe);
        if (chain && chain.length >= 4) {
          starts.push({ aStart, bodyStart: m.index });
        }
      }

      if (!starts.length) return [];

      const sections = [];
      for (let i = 0; i < starts.length; i++) {
        const current = starts[i];
        const previousEnd = i === 0 ? 0 : starts[i - 1].bodyStart;
        const end = i + 1 < starts.length ? starts[i + 1].bodyStart : text.length;

        // Evita considerar "A)" de explicações internas como nova questão:
        // o trecho entre duas âncoras precisa conter uma cadeia válida.
        const body = text.slice(previousEnd, end).trim();
        if (body && findAltChain(body)) {
          sections.push({
            items: [{
              num: i + 1,
              start: previousEnd,
              bodyStart: previousEnd,
              end,
              body
            }]
          });
        }
      }

      return sections;
    }

    // Plano B: sem "Questão N" / "N.", separa pelos códigos numéricos (ex.: 4000165627) que abrem cada questão
    function splitByCodes(text) {
      const re = /(?:^|\n)[ \t]*(\d{8,12})[ \t]*(?=\n|$)/g;
      const hits = [];
      let m;
      while ((m = re.exec(text)) !== null) hits.push({ code: m[1], start: m.index, bodyStart: m.index + m[0].length });
      if (hits.length < 1) return null;
      const firstByCode = {};
      const blocks = [];
      const commentMap = {};
      hits.forEach((h, i) => {
        const body = text.slice(h.bodyStart, i + 1 < hits.length ? hits[i + 1].start : text.length);
        if (firstByCode[h.code] === undefined) {
          firstByCode[h.code] = blocks.length + 1;
          blocks.push({ num: blocks.length + 1, body: h.code + '\n' + body });
        } else {
          const n = firstByCode[h.code];
          commentMap[n] = (commentMap[n] ? commentMap[n] + '\n' : '') + body.trim();
        }
      });
      return { blocks, commentMap };
    }

    function parseQuestionsLocally(rawText) {
      const text = String(rawText || '')
        .replace(/\r/g, '')
        .replace(/--- PÁGINA \d+ ---/g, '\n')
        .replace(/\u00a0/g, ' ')
        .replace(/^[ \t]*[▶►▷]?[ \t]*Assistir\s+(?:a\s+)?(?:resolu[çc][ãa]o\s+)?em\s+v[ií]deo[ \t]*$/gim, '')
        .replace(/^[ \t]*www\.\S+(?:[ \t]*\|.*)?$/gim, '');

      let sections = splitIntoSections(text);
      let qSection = sections.find(s => s.items.filter(it => findAltChain(it.body)).length >= Math.ceil(s.items.length / 2));

      // Se o PDF/texto perdeu todas as linhas "Questão N - ID ...",
      // tenta reconstruir as questões diretamente pelas cadeias A-B-C-D(-E).
      if (!qSection) {
        const recovered = splitWithoutQuestionHeaders(text);
        if (recovered.length) {
          sections = recovered;
          qSection = recovered[0];
          qSection.items = recovered.flatMap(s => s.items);
        }
      }

      let blocks = [];
      let commentMap = {};
      if (qSection) {
        // Resolução em seção separada (por número da questão)
        sections.filter(s => s !== qSection).forEach(s => {
          s.items.forEach(it => {
            commentMap[it.num] = (commentMap[it.num] ? commentMap[it.num] + '\n' : '') + it.body.trim();
          });
        });

        // Blocos sem alternativas dentro da lista de questões são listas internas do comentário: voltam para a questão anterior
        qSection.items.forEach(it => {
          if (findAltChain(it.body)) {
            blocks.push({ num: it.num, body: it.body });
          } else if (blocks.length) {
            blocks[blocks.length - 1].body += '\n' + it.body;
          }
        });
      } else {
        const fb = splitByCodes(text);
        if (!fb) return [];
        blocks = fb.blocks;
        commentMap = fb.commentMap;
      }

      const gabMap = parseGabaritoLines(text);
      const questions = [];

      blocks.forEach(b => {
        const parsed = parseQuestionBlock(dropGabaritoLists(b.body));
        if (!parsed) return;

        const extra = dropGabaritoLists(commentMap[b.num] || '');
        const links = extractLinkInfo(b.body + '\n' + extra);
        const comment = parseComment([parsed.commentRaw, extra].filter(Boolean).join('\n'), parsed.alternativas.map(a => a.letra));
        const correta = comment.correta || gabMap[b.num] || '';

        questions.push({
          id: questions.length + 1,
          numero: b.num,
          codigo: parsed.codigo,
          instituicao: parsed.instituicao || String(state.deckName || 'QUESTÕES').toUpperCase(),
          ano: parsed.ano,
          enunciado: parsed.enunciado,
          alternativas: parsed.alternativas.map(a => ({ ...a, explicacao: comment.expl[a.letra] || '' })),
          correta,
          comentario: comment.comentario,
          videoUrl: links.videoUrl,
          allLinks: links.allLinks,
          selected: null,
          answered: false,
          eliminated: []
        });
      });

      return questions;
    }
    // @@PARSER_END

async function processPdf(file){
  const progress=document.getElementById('progress'); progress.textContent='Lendo PDF...';
  try{
    const buffer=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:buffer}).promise;
    const pages=[]; let videos=0;
    for(let p=1;p<=pdf.numPages;p++){
      progress.textContent=`Lendo página ${p} de ${pdf.numPages}...`;
      const page=await pdf.getPage(p), tc=await page.getTextContent(), anns=await page.getAnnotations();
      let items=tc.items.filter(x=>x.str?.trim()).map(x=>({str:x.str,x:x.transform[4],y:x.transform[5],w:x.width||0}));
      const links=[],consumed=new Set();
      for(const a of anns){
        const url=a.url||a.unsafeUrl;if(a.subtype!=='Link'||!url)continue;
        const r=a.rect||[0,0,0,0],under=items.filter(it=>it.x>=r[0]-3&&it.x<=r[2]+3&&it.y>=r[1]-4&&it.y<=r[3]+2);
        const label=under.map(it=>it.str).join(' ');
        const isVideo=VIDEO_HOST_RE.test(url)||!label||/v[ií]deo|assistir|play/i.test(label);
        if(isVideo){videos++;under.forEach(it=>consumed.add(it))}
        links.push({str:` [${isVideo?'LINK_VIDEO':'LINK'}: ${url}] `,x:r[0],y:under.length?under[0].y:(r[1]+r[3])/2-3,w:0});
      }
      items=items.filter(x=>!consumed.has(x)).concat(links).sort((a,b)=>b.y-a.y);
      const lines=[];
      for(const it of items){const last=lines[lines.length-1];if(last&&Math.abs(last.y-it.y)<=4)last.items.push(it);else lines.push({y:it.y,items:[it]})}
      pages.push(lines.map(line=>{line.items.sort((a,b)=>a.x-b.x);let out='',end=null;for(const it of line.items){if(out&&!out.endsWith(' ')&&!it.str.startsWith(' ')){const gap=end===null?99:it.x-end;if(gap>.5)out+=' '}out+=it.str;end=it.x+it.w}return out.trim()}));
    }
    const text=pages.flat().filter(Boolean).join('\n');
    const parsed=parseQuestionsLocally(text);
    if(!parsed.length)throw new Error('Não foi possível identificar as questões.');
    state.questions=parsed.map(cleanQuestion);state.current=0;save();document.getElementById('importModal').classList.remove('open');render();
  }catch(e){progress.textContent='Erro: '+e.message}
}
load();render(); if(window.lucide) lucide.createIcons();
</script>
